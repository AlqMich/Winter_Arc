# Netlify: construye la app, publica dist/ y despliega las funciones de notificaciones.
[build]
  command = "node scripts/build.mjs"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# El service worker y el manifest no deben quedarse en caché del navegador.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
